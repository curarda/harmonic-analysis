# Cloudflare Pages + Functions + D1 configuration.
# Nothing secret lives here. The admin token is set separately as an encrypted
# secret (see README), NOT in this file.

name = "harmonic-analysis"
pages_build_output_dir = "."
compatibility_date = "2024-11-01"

# D1 database binding. Fill database_id with the value printed by
#   npx wrangler d1 create harmonic-analysis-db
[[d1_databases]]
binding = "DB"
database_name = "harmonic-analysis-db"
database_id = "REPLACE_WITH_YOUR_D1_DATABASE_ID"
